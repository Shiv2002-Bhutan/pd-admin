
name: Build and Publish Backend Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/shiv2002-bhutan/pd-backend:latest
            ghcr.io/shiv2002-bhutan/pd-backend:sha-${{ github.sha }}

  build-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish archive image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.archive
          push: true
          tags: |
            ghcr.io/shiv2002-bhutan/pd-backend-archive:latest
            ghcr.io/shiv2002-bhutan/pd-backend-archive:sha-${{ github.sha }}
